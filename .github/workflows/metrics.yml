name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: "main"}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Mido-77
          template: classic
          base: header, activity, community, repositories
          config_timezone: Africa/Cairo
          plugin_pacman: yes
          plugin_pacman_duration: 60
          plugin_pacman_sections: repositories, activity
          output_action: write
