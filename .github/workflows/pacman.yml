name: Generate Pacman Animation
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate-pacman:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Generate Pacman SVG
      run: |
        # Download the SVG directly using curl
        curl -L "https://github-contributions-api.deno.dev/Mido-77.svg?animation=true&theme=classic" -o pacman.svg
        curl -L "https://github-contributions-api.deno.dev/Mido-77.svg?animation=true&theme=dark" -o pacman-dark.svg
        
    - name: Create Output Branch
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Create or switch to output branch
        git checkout --orphan output || git checkout output
        
        # Remove everything except the SVG files
        find . -maxdepth 1 -type f ! -name 'pacman.svg' ! -name 'pacman-dark.svg' ! -name '.git' -exec rm -f {} +
        find . -maxdepth 1 -type d ! -name '.git' ! -name '.' -exec rm -rf {} +
        
        # Add and commit
        git add -f pacman.svg pacman-dark.svg
        git commit -m "Update Pacman animation - $(date)"
        git push origin output --force
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
